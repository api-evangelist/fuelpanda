aid: fuelpanda
name: FleetPanda
description: FleetPanda is a cloud-based dispatch and delivery platform for fuel distributors,
  describing itself as "the operating system for fuel distributors." It manages fuel
  distribution operations across multiple business lines including tank wagon / wet
  hosing, truck & trailer, transport, lubricants, and propane delivery. The platform
  provides a dispatch dashboard with real-time driver and inventory visibility, order
  management, same-day billing and invoicing with auto-BOL linking, automated reconciliation,
  pricing and fee management, reporting and analytics, an iOS/Android driver app, and
  a customer portal. FleetPanda is SOC 2 Type 1 compliant and is backed by 500 Global.
  The company is catalogued in the API Evangelist network; it does not currently publish
  a public API, developer portal, or SDKs.
